<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật tài khoản</title>
    <link rel="stylesheet" href="public/css/layout.css">
    <link rel="stylesheet" href="public/css/header_footer.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Đăng nhập</a></li>
                <li><a href="">Đăng ký</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Màn hình cập nhật</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="username">UserName</label>
                    <input type="text" id="username" name="username" value="user1" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="user1@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Nhập lại mật khẩu</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <div class="form-actions">
                    <button class="btn-huy" type="submit">Hủy</button>  
                    <button type="submit">Đăng ký</button>                    
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Website. Tất cả quyền lợi được bảo lưu.</p>
    </footer>
</body>
</html>
